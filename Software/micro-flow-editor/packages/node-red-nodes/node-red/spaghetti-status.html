<script type="text/javascript">
  RED.nodes.registerType("spaghetti-status", {
    category: "SpaghettiLAB",
    color: "#2a9d8f",
    defaults: {
      name: { value: "" },
      connection: { type: "spaghetti-connection", required: true },
    },
    inputs: 1,
    outputs: 1,
    icon: "font-awesome/fa-heartbeat",
    label: function () {
      return this.name || "status";
    },
  });
</script>

<script type="text/html" data-template-name="spaghetti-status">
  <div class="form-row">
    <label for="node-input-connection">Connection</label>
    <input type="text" id="node-input-connection" />
  </div>
  <div class="form-row">
    <label for="node-input-name">Name</label>
    <input type="text" id="node-input-name" />
  </div>
</script>

<script type="text/html" data-help-name="spaghetti-status">
  <p>
    Emits a readable Core status (<code>@spaghettilab/core-status</code>'s
    real <code>CoreStatusView</code>) whenever a <code>STATUS</code> event
    arrives, or on any input <code>msg</code> to force a refresh.
  </p>
</script>
